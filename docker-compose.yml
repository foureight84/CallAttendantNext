services:
  callattendant:
    build: .
    ports:
      - "3000:3000"
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    volumes:
      - ./messages:/app/messages
      - ./data:/app/data
      - ./piper-models:/app/piper-models
      - ./logs:/app/logs
    environment:
      - SERIAL_PORT=/dev/ttyUSB0
      - SERIAL_BAUD_RATE=115200
      - DB_PATH=/app/data/callattendant.db
      - MESSAGES_DIR=/app/messages
      - SCREENING_MODE=whitelist,blacklist
      - BLOCK_SERVICE=NOMOROBO
      - AUTO_BLOCK_SPAM=true
      - SPAM_THRESHOLD=2
      - RINGS_BEFORE_VM=4
      - RINGS_BEFORE_VM_SCREENED=1
      - BLOCKLIST_ACTION=2
      - RINGS_BEFORE_VM_BLOCKLIST=0
      - PIPER_MODELS_DIR=/app/piper-models
      - PIPER_LENGTH_SCALE=1.0
      - ENABLE_GPIO=false
      - DEBUG_CONSOLE=false
      - NODE_ENV=production
      # Exit on an unrecoverable modem wedge so `restart: unless-stopped` (and/or
      # the host watchdog) restarts the container. See "Modem Crash Recovery".
      - MODEM_EXIT_ON_UNRECOVERABLE=true
    restart: unless-stopped
    # Reports modem health (200 = connected & responsive, 503 = wedged/offline).
    # Used for visibility and by the host watchdog (scripts/modem-watchdog.sh).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
